name: Sync About to README

# Copies the About page from the live website into README.md.
# Runs every hour (private repos get 2000 free Action minutes/month), and can be started by hand: Actions → "Sync About to README" → Run workflow.

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-about
  cancel-in-progress: false

env:
  SITE_URL: https://nikolajalbrechtsen.com

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update About section from the website
        run: python3 .github/scripts/sync_about.py "$SITE_URL" README.md

      - name: Commit if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: sync About section from ${SITE_URL}/about"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
