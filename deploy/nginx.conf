# Nginx site for the website. Placeholders (__APP_DIR__ etc.) are filled in by deploy/install.sh.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root __APP_DIR__/public;
    index index.php;
    charset utf-8;
    client_max_body_size 64M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php__PHP__-fpm.sock;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 600;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # ------------------------------------------------------------------
    # VS Code (code-server) at /code/ — Nginx asks Laravel first whether
    # the logged-in user may use it (permission "use_code_editor").
    # ------------------------------------------------------------------
    location = /_code-auth-check {
        internal;
        fastcgi_pass unix:/run/php/php__PHP__-fpm.sock;
        fastcgi_pass_request_body off;
        fastcgi_param SCRIPT_FILENAME   __APP_DIR__/public/index.php;
        fastcgi_param SCRIPT_NAME       /index.php;
        fastcgi_param DOCUMENT_ROOT     __APP_DIR__/public;
        fastcgi_param DOCUMENT_URI      /index.php;
        fastcgi_param REQUEST_URI       /_code-auth;
        fastcgi_param QUERY_STRING      "";
        fastcgi_param REQUEST_METHOD    GET;
        fastcgi_param CONTENT_TYPE      "";
        fastcgi_param CONTENT_LENGTH    "";
        fastcgi_param SERVER_PROTOCOL   $server_protocol;
        fastcgi_param GATEWAY_INTERFACE CGI/1.1;
        fastcgi_param REMOTE_ADDR       $remote_addr;
        fastcgi_param SERVER_ADDR       $server_addr;
        fastcgi_param SERVER_PORT       $server_port;
        fastcgi_param SERVER_NAME       $host;
        fastcgi_param HTTPS             $https if_not_empty;
        fastcgi_param HTTP_PROXY        "";
    }

    location = /code {
        return 302 /code/;
    }

    location /code/ {
        auth_request /_code-auth-check;
        error_page 401 = @code_login;

        proxy_pass http://127.0.0.1:__CODE_PORT__/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_set_header Accept-Encoding gzip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        client_max_body_size 0;
    }

    location @code_login {
        return 302 /admin/login;
    }
}
